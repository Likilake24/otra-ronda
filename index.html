<style>

:root{

*{box-sizing:border-box}

.slot{display:flex;gap:12px;justify-content:center}.reel{font-size:56px;background:linear-gradient(#d8cbb4,#fff8ec 30%,#fff8ec 70%,#d8cbb4);border:4px solid var(--amber);border-radius:10px;width:90px;height:104px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 12px rgba(0,0,0,.35)}
.reel.spin{filter:blur(1.5px);transform:translateY(2px)}

.slotmsg{font-family:var(--display);color:var(--fg);text-align:center;min-height:1.4em}.slotmsg.win{color:#ffd14a;text-shadow:0 0 10px rgba(255,209,74,.6)}

.qm{display:inline-flex;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);font:500 12px var(--body);align-items:center;justify-content:center;color:var(--muted);cursor:help;position:relative;vertical-align:middle;margin-left:6px}

.hype{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hype small{color:var(--muted)}.hb{height:12px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}.hb i{display:block;height:100%;background:var(--good);transition:width .4s}.hb.mc i{background:var(--bad)}

.tarot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.tcard .te{font-size:40px}.tcard b{font-family:var(--display);font-size:15px;text-align:center;padding:0 4px}
.tcard:hover:not([disabled]),.tcard.sel{transform:translateY(-6px)}.tcard.up{background:linear-gradient(#fff8ec,#e8d8b8);color:#2a1038;transform:translateY(-6px) scale(1.06)}.tcard.dim{opacity:.35}

.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}

<div id="app">
  <div id="screen">
    <canvas id="cv" width="240" height="176" aria-label="Pantalla del juego"></canvas>
    <div id="online" hidden></div>

  </div>

      <button class="pb u" data-k="up" aria-label="Arriba">▲</button>

<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");ctx.imageSmoothingEnabled=false;
const SW=240,SH=176,T=16;
const rnd=()=>Math.random(),ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const now=()=>performance.now();
const ease=p=>1-Math.pow(1-Math.min(1,Math.max(0,p)),3);
const rid=()=>Math.random().toString(36).slice(2,10);

/* ===================== SONIDO ===================== */
let AC=null,muted=false;
function sfx(kind){
  if(muted)return;
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const t0=AC.currentTime;
    const tone=(f,d,type="square",v=.04,w=0,slide)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0+w);
      if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+w+d);g.gain.setValueAtTime(v,t0+w);g.gain.exponentialRampToValueAtTime(.0001,t0+w+d);
      o.connect(g);g.connect(AC.destination);o.start(t0+w);o.stop(t0+w+d+.02)};
    const seq=(fs,d,type,v,gap)=>fs.forEach((f,i)=>tone(f,d,type,v,i*gap));
    ({blip:()=>tone(880,.035,"square",.018),sel:()=>tone(660,.04,"square",.025),
      hit:()=>tone(190,.16,"sawtooth",.06,0,60),super:()=>{tone(240,.12,"sawtooth",.07,0,70);tone(110,.22,"square",.05,.08,45)},
      weak:()=>tone(320,.1,"triangle",.04,0,220),heal:()=>seq([523,659,784,1046],.12,"triangle",.05,.09),
      lvl:()=>seq([523,659,784,1046,1318],.11,"square",.035,.09),catch:()=>seq([784,988,1175,1568],.1,"square",.04,.08),
      plop:()=>tone(420,.08,"triangle",.06,0,260),enc:()=>seq([330,262,330,262,392,494],.08,"square",.04,.07),
      faint:()=>tone(420,.55,"triangle",.06,0,70),door:()=>{tone(300,.07,"square",.03);tone(450,.08,"square",.03,.07)},
      buy:()=>{tone(988,.06,"square",.03);tone(1318,.1,"square",.03,.06)},status:()=>seq([600,500,400],.07,"triangle",.04,.06),
      throw:()=>tone(300,.3,"triangle",.04,0,900),evo:()=>seq([392,523,659,784,1046,784,1046,1318],.12,"square",.035,.11),
      alert:()=>seq([988,1318],.09,"square",.05,.09),quest:()=>seq([659,784,988,1318],.1,"triangle",.05,.1),
      win:()=>seq([523,523,523,659,784,659,784,1046],.12,"square",.04,.12),
      rumba:()=>{const n=[330,349,415,440,494,523,494,440,415,349,330,330,415,349,330];n.forEach((f,i)=>{tone(f,.14,"triangle",.05,i*.13+(i%3===2?.05:0));if(i%3===0)tone(f/2,.12,"square",.02,i*.13)})}
    }[kind]||(()=>{}))();
  }catch(e){}
}

const MUS={cur:null,step:0,next:0,timer:null,gain:null,noise:null,boost:0};
function parseTrack(tr){if(tr._p)return tr._p;const sp=s=>s?s.split(/\s+/):[];tr._p={lead:sp(tr.lead),bass:sp(tr.bass),drum:sp(tr.drum),strumPat:sp(tr.strumPat)};return tr._p}
function musNote(m,t,dur,type,vol,pluck){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(440*Math.pow(2,(m-69)/12),t);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(pluck?dur*.7:dur*.95));o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+dur+.02)}
function musNoise(t,dur,vol,freq,type){if(!MUS.noise){const b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MUS.noise=b}
  const s=AC.createBufferSource();s.buffer=MUS.noise;const f=AC.createBiquadFilter();f.type=type||"highpass";f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(MUS.gain);s.start(t);s.stop(t+dur+.02)}
function musDrum(k,t){
  if(k==="k"){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+.16)}
  else if(k==="s")musNoise(t,.1,.06,1500,"bandpass");
  else if(k==="h")musNoise(t,.03,.025,7000);
  else if(k==="c"){musNoise(t,.03,.05,1800,"bandpass");musNoise(t+.015,.03,.04,1800,"bandpass");musNoise(t+.03,.06,.04,1800,"bandpass")}
  else if(k==="d"){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(70,t+.15);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+.2)}
  else if(k==="t")musNoise(t,.04,.04,3500,"bandpass");
  else if(k==="g"){musNote(43,t,1.6,"sine",.06);musNote(55,t,1.2,"sine",.02);musNoise(t,.4,.015,600,"bandpass")}
}
function musStep(tr,i,t,stepDur){
  const p=parseTrack(tr);const L=p.lead[i%p.lead.length],Bn=p.bass[i%p.bass.length],D=p.drum[i%p.drum.length];
  const lv=tr.lv*(1+MUS.boost);
  if(L&&L!=="-")musNote(+L,t,stepDur*(tr.pluck?1.6:1.05),tr.lw,lv,tr.pluck);
  if(Bn&&Bn!=="-")musNote(+Bn,t,stepDur*.95,tr.bw,tr.bv||.05);
  if(D&&D!=="-")D.split("").forEach(k=>musDrum(k,t));
  if(tr.strum){const sp=p.strumPat[i%8];if(sp==="x"){const ch=tr.strum[Math.floor(i/8)%tr.strum.length];ch.forEach((m,j)=>musNote(m+12,t+j*.012,stepDur*.9,"triangle",.022*(1+MUS.boost),true))}}
}
function musTick(){
  if(!AC||!MUS.synth)return;const tr=TRACKS[MUS.synth];const stepDur=60/tr.bpm/2;
  while(MUS.next<AC.currentTime+.15){musStep(tr,MUS.step,MUS.next,stepDur);MUS.next+=stepDur;MUS.step=(MUS.step+1)%32}
}

function playList(name){const L=PLAYLISTS[name],i=(AUD.pi||0)%L.length;const a=new Audio(L[i]);a.loop=false;a.volume=0;AUD.el=a;
  a.onended=()=>{if(MUS.cur===name&&AUD.el===a){AUD.pi=(i+1)%L.length;playList(name)}};
  a.onerror=()=>{AUD.failed[name]=true;if(MUS.cur===name&&AUD.el===a){AUD.el=null;startSynth(name)}};
  const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});fadeAudio(a,.42,700)}
function fadeAudio(a,to,ms,done){const from=a.volume,t0=performance.now();const st=()=>{const p=Math.min(1,(performance.now()-t0)/ms);try{a.volume=Math.max(0,Math.min(1,from+(to-from)*p))}catch(e){}if(p<1)requestAnimationFrame(st);else if(done)done()};st()}
function startSynth(name){if(!AC)return;if(!MUS.gain){MUS.gain=AC.createGain();MUS.gain.gain.value=.55;MUS.gain.connect(AC.destination)}
  MUS.synth=TRACKS[name]?name:null;MUS.step=0;MUS.next=AC.currentTime+.08;if(MUS.synth&&!MUS.timer)MUS.timer=setInterval(musTick,40)}
function stopSynth(){MUS.synth=null;if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null}}
function setMusic(name){
  if(muted||!AC)name=null;if(name===MUS.cur)return;MUS.cur=name;
  if(AUD.el){const old=AUD.el;AUD.el=null;fadeAudio(old,0,350,()=>{try{old.pause()}catch(e){}})}
  stopSynth();if(!name)return;
  if(PLAYLISTS[name]&&!AUD.failed[name]){AUD.pi=AUD.pi===undefined?0:AUD.pi+1;playList(name);return}
  const s=SONGS[name];
  if(s&&!AUD.failed[name]){
    let a=AUD.cache[name];if(!a){a=new Audio(s[0]);a.loop=true;a.preload="auto";a.onerror=()=>{AUD.failed[name]=true;if(MUS.cur===name&&AUD.el===a){AUD.el=null;startSynth(name)}};AUD.cache[name]=a}
    if(name==="battle")try{a.currentTime=0}catch(e){}
    a.volume=0;AUD.el=a;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{AUD.failed[name]=true;if(MUS.cur===name){AUD.el=null;startSynth(name)}});fadeAudio(a,.42,700);
  }else startSynth(name);
}

function genSprite(id,mode,shiny){
  const key="g|"+id+"|"+(mode||"")+(shiny?"|s":"");if(sprCache[key])return sprCache[key];

  let hs=0;for(const ch of id)hs=(hs*31+ch.charCodeAt(0))>>>0;const rot=110+hs%150;
  const col=(h,keep)=>{if(h.startsWith("rgba"))return h;if(mode==="sil")return"#0a0806";if(mode==="white")return"#ffffff";return shiny&&!keep?shiftHex(h,rot):h};
  const P={
    r(X,Y,W,H,h,keep){if(h.startsWith("rgba(0,0,0,0)")){x.clearRect(X,Y,W,H);return}x.fillStyle=col(h,keep);x.fillRect(X,Y,W,H)},
    box(X,Y,W,H,h){P.r(X,Y,W,H,OUT,true);P.r(X+1,Y+1,W-2,H-2,h)},
    text(str,cx,Y,h,maxW){if(!str)return;textLines(str,maxW).forEach((ln,li)=>{const w=ln.length*4-1,x0=Math.round(cx-w/2);[...ln].forEach((chr,ci)=>{const gl=FONT[chr.toUpperCase()]||FONT["?"];
      for(let b=0;b<15;b++)if(gl[b]==="1")P.r(x0+ci*4+b%3,Y+li*6+Math.floor(b/3),1,1,h)})})},
    face(cx,Y,st,gap,eyeCol){st=st||"happy";gap=gap||3;const e1=cx-gap-2,e2=cx+gap;const W="#ffffff";
      if(st==="cool"){P.r(e1-1,Y,e2-e1+4,1,"#111111",true);P.r(e1,Y,2,2,"#111111",true);P.r(e2,Y,2,2,"#111111",true);P.r(e1,Y,1,1,"#9fd8ff",true);P.r(e2,Y,1,1,"#9fd8ff",true);
        P.r(cx-1,Y+3,3,1,OUT,true);P.r(cx+2,Y+2,1,1,OUT,true);return}
      if(st==="sleepy"){P.r(e1,Y+1,2,1,eyeCol||OUT,true);P.r(e2,Y+1,2,1,eyeCol||OUT,true);P.r(cx-1,Y+3,2,1,eyeCol||OUT,true);return}
      P.r(e1,Y,2,2,eyeCol||W,true);P.r(e2,Y,2,2,eyeCol||W,true);const pc=st==="evil"?"#e0202a":eyeCol?"#0a1a2a":OUT;P.r(e1+1,Y+1,1,1,pc,true);P.r(e2,Y+1,1,1,pc,true);
      if(st==="angry"||st==="evil"){P.r(e1-1,Y-1,2,1,OUT,true);P.r(e2+1,Y-1,2,1,OUT,true)}
      const mc=eyeCol||OUT;
      if(st==="happy"){P.r(cx-2,Y+3,4,1,mc,true);P.r(cx-3,Y+2,1,1,mc,true);P.r(cx+2,Y+2,1,1,mc,true)}
      else if(st==="angry")P.r(cx-2,Y+3,4,1,mc,true);
      else if(st==="evil"){P.r(cx-3,Y+3,6,1,mc,true);P.r(cx-2,Y+4,4,1,mc,true);P.r(cx-2,Y+3,1,1,W,true);P.r(cx+1,Y+3,1,1,W,true)}
      else if(st==="drunk"){P.r(e1,Y,2,1,OUT,true);P.r(cx-2,Y+3,4,1,mc,true);P.r(cx-1,Y+4,2,1,"#e04a6a",true)}},
    arms(Y,xl,xr,h){P.r(xl-2,Y,2,3,OUT,true);P.r(xr+1,Y,2,3,OUT,true);P.r(xl-2,Y+1,1,1,h);P.r(xr+2,Y+1,1,1,h)},
    legs(cx,Y,sep){P.r(cx-sep-1,Y,2,2,OUT,true);P.r(cx+sep-1,Y,2,2,OUT,true);P.r(cx-sep-2,Y+2,3,1,OUT,true);P.r(cx+sep-1,Y+2,3,1,OUT,true)}
  };

function hexToHsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}

  return shinyCache[palKey]=o}
function spriteCanvas(rowsKey,palKey,mode,shiny){
  const key=rowsKey+"|"+palKey+"|"+(mode||"")+(shiny?"|✨":"");if(sprCache[key])return sprCache[key];
  const rows=ROWS[rowsKey],pal=shiny?shinyPal(palKey):PAL[palKey],w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
  rows.forEach((r,j)=>[...r].forEach((ch,i)=>{const col=pal[ch];if(col){x.fillStyle=mode==="sil"?"#0a0806":mode==="white"?"#ffffff":col;x.fillRect(i,j,1,1)}}));

function pvpResolve(st,aH,aG){
  const log=[];const cur=s=>st[s].team[st[s].i];
  if(aH.ff||aG.ff){const s=aH.ff?"h":"g";log.push({k:"ff",s});log.push({k:"end",w:s==="h"?"g":"h"});return log}
  const H=cur("h"),G=cur("g");const mh=H.moves[aH.mv|0]||H.moves[0],mg=G.moves[aG.mv|0]||G.moves[0];
  const sh=eff(H,"spd"),sg=eff(G,"spd");const hFirst=sh>sg||(sh===sg&&rnd()<.5);
  const order=hFirst?[["h","g",mh],["g","h",mg]]:[["g","h",mg],["h","g",mh]];
  order.forEach(([us,ts,mv],idx)=>{const u=cur(us),t=cur(ts);if(u.hp<=0||t.hp<=0)return;resolveMoveLog(u,t,mv,us,ts,idx===0,log)});
  for(const s of["h","g"]){if(cur(s).hp<=0){log.push({k:"ko",s});const ni=st[s].team.findIndex(x=>x.hp>0);if(ni<0){log.push({k:"end",w:s==="h"?"g":"h"});return log}st[s].i=ni;resetV(st[s].team[ni]);log.push({k:"send",s,i:ni})}}
  return log;
}
function resolveMoveLog(u,t,mvId,us,ts,first,log){
  const mv=MV[mvId];
  if(u.v.skip){u.v.skip=false;log.push({k:"skip",s:us});return}
  log.push({k:"use",s:us,mv:mvId});
  if(rnd()*100>accOf(mvId)*(1-0.15*u.v.acc)){log.push({k:"miss",s:us});return}
  if(mv.p>0){const hits=mv.eff==="multi"?3:1,m=tmult(mv.t,SP[t.sp].t);let total=0;
    for(let h=0;h<hits&&t.hp>0;h++){let d=((2*u.lvl/5+2)*mv.p*eff(u,"atk")/eff(t,"def"))/50+2;if(mv.t===SP[u.sp].t)d*=1.5;d*=m;d*=.85+rnd()*.15;const crit=rnd()<(SP[u.sp].crit?1/4:1/16);if(crit)d*=1.5;if(mv.eff==="first"&&first)d*=1.5;
      d=Math.max(1,Math.floor(d));t.hp=Math.max(0,t.hp-d);total+=d;log.push({k:"hit",s:ts,d,m,crit,hp:t.hp,t:mv.t})}
    if(hits>1)log.push({k:"multi"});if(mv.eff==="first"&&first)log.push({k:"first"});
    if(mv.eff==="drain"&&u.hp>0){const h=Math.max(1,Math.floor(total/2));u.hp=Math.min(maxhp(u),u.hp+h);log.push({k:"heal",s:us,h,hp:u.hp})}
  }else if(mv.eff==="heal"){const b=u.hp;u.hp=Math.min(maxhp(u),u.hp+Math.floor(maxhp(u)*.4));log.push({k:"heal",s:us,h:u.hp-b,hp:u.hp})}
  else if(mv.eff==="atkup"){const ok=!u.v.atk;u.v.atk=1;log.push({k:"up",s:us,ok})}
  else{let ok=true;if(mv.eff==="acc"){ok=t.v.acc<3;if(ok)t.v.acc++}else if(mv.eff==="spd"){ok=t.v.spd<2;if(ok)t.v.spd++}else if(mv.eff==="skip"){ok=rnd()<.6;if(ok)t.v.skip=true}
    log.push({k:"st",s:ts,e:mv.eff,ok,mv:mvId})}
}
async function playLog(log,mySide){
  const who=s=>s===mySide?"p":"e",mon=s=>who(s)==="p"?B.p:B.e,pos=s=>who(s)==="e"?EPOS:PPOS;
  for(const L of log){
    if(!L||typeof L!=="object")continue;
    if(L.k==="ff"){await say(L.s===mySide?"Te rindes. Tu colega se ríe de ti en el grupo de WhatsApp.":`¡${B.trainer.name} se rinde! Cobarde.`)}
    else if(L.k==="skip"){const m=mon(L.s);m.v.skip=false;updHud();await say(`${nameOf(m)} sigue sin enterarse de nada y pierde el turno.`)}
    else if(L.k==="use"&&MV[L.mv]){const m=mon(L.s);await say(`${nameOf(m)} usa ${MV[L.mv].n}.`);B.an[who(L.s)]={type:"lunge",start:now()};await sleep(200)}
    else if(L.k==="miss"){pop(who(L.s)==="p"?"e":"p","¡FALLO!","#ffffff");await say("¡Pero falla! Ni de lejos.")}
    else if(L.k==="hit"){const m=mon(L.s),w=who(L.s),b=pos(L.s);m.hp=Math.max(0,Math.min(maxhp(m),L.hp|0));burst(TYPES[L.t]?L.t:"normal",b.x,b.y-24,L.m===2?26:16);B.an[w]={type:"hit",start:now()};
      if(L.m===2){B.shakeUntil=now()+350;sfx("super")}else if(L.m===.5)sfx("weak");else sfx("hit");pop(w,"-"+(L.d|0)+(L.crit?"!":""),L.m===2?"#ffd14a":"#ffffff");updHud();await sleep(450);
      if(L.crit)await say("¡Golpe crítico! Le ha dado de lleno.");if(L.m===2)await say("¡Le ha entrado como un chupito!");else if(L.m===.5)await say("Eso le ha hecho cosquillas…")}
    else if(L.k==="up"){const m=mon(L.s),b=pos(L.s);if(L.ok){m.v.atk=1;burst("electrico",b.x,b.y-24,18);sfx("lvl");updHud();await say(`¡A ${nameOf(m)} le pega el subidón! Su ataque sube un montón.`)}else await say(`${nameOf(m)} ya va a tope de cafeína.`)}
    else if(L.k==="multi")await say("¡Le ha dado 3 veces! Oferta del día.");
    else if(L.k==="first")await say("¡Desenfundó primero!");
    else if(L.k==="heal"){const m=mon(L.s),b=pos(L.s);m.hp=Math.max(0,Math.min(maxhp(m),L.hp|0));burst("heal",b.x,b.y-24,14);sfx("heal");updHud();await say(`${nameOf(m)} recupera ${L.h|0} PV.`)}
    else if(L.k==="st"){const m=mon(L.s),b=pos(L.s),tn=nameOf(m);burst(MV[L.mv]?MV[L.mv].t:"normal",b.x,b.y-24,14);sfx("status");
      if(!L.ok)await say("No le ha hecho ni caso.");else{if(L.e==="acc")m.v.acc++;if(L.e==="spd")m.v.spd++;if(L.e==="skip")m.v.skip=true;updHud();
        await say(L.e==="acc"?`¡A ${tn} le cuesta más acertar!`:L.e==="spd"?`¡${tn} se ha quedado empanao!`:`¡${tn} perderá su próximo turno!`)}}
    else if(L.k==="ko"){const m=mon(L.s);m.hp=0;updHud();await faintAnim(who(L.s));await say(`¡${nameOf(m)} está KO!`)}
    else if(L.k==="send"){const w=who(L.s),list=w==="p"?B.myTeam:B.enemies,m=list[L.i|0];if(m){resetV(m);if(w==="p")B.p=m;else B.e=m;S.seen[m.sp]=1;updHud();B.an[w]={type:"in",start:now()};await sleep(400);
      await say(w==="p"?`¡Adelante, ${SP[m.sp].n}!`:`${B.trainer.name} saca a ${SP[m.sp].n}.`)}}
    else if(L.k==="end")return L.w===mySide?"win":"lose";
  }
  return null;
}
async function pvpBattle({id,host,opp,oppName,oppSkin,oppTeam}){

    const i=await choose(`Ronda ${n} · ¿Qué hace ${SP[B.p.sp].n}?`,[...B.p.moves.map(mv=>{const M=MV[mv];const m=M.p?tmult(M.t,SP[B.e.sp].t):1;return{label:M.n,chip:M.t,sub:(M.p?"Pot. "+M.p:"Estado")+(m===2?" ×2":m===.5?" ×½":""),subCls:m===2?"x2":m===.5?"xh":""}}),{label:"🏳️ Rendirse"}],
      {cancel:false,info:j=>j<B.p.moves.length?moveInfo(B.p.moves[j],B.e):"Te rindes y pierdes el combate."});
    const act=i===B.p.moves.length?{ff:1}:{mv:i};

    let log;
    if(host){
      const r=await waitPeer(opp,pr=>pr.pvp&&pr.pvp.id===id&&pr.pvp.n===n?pr.pvp.act:null,120000,`Esperando a ${oppName}…`);
      if(r.fail){result=r.fail==="cancel"?"lose":"win";if(r.fail==="cancel")setMP({pvp:{id,n,act:{ff:1}}});await say(r.fail==="cancel"?"Te piras del combate.":`${oppName} se ha pirado. Ganas por abandono.`);break}
      const oa=r.v&&typeof r.v==="object"?r.v:{mv:0};
      log=pvpResolve(st,act,{ff:oa.ff?1:0,mv:Math.max(0,Math.min(3,oa.mv|0))});

  }

  else if(result==="lose")await say(`${oppName} te ha ganado. La próxima ronda la pagas tú.`);

  await battleOutro();
}

    function spin(){const bet=BETS[bi];if(spinning||S.money<bet)return;spinning=true;S.money-=bet;sfx("throw");lastWin=0;

function eMovePick(){if(!B.rig)return pick(B.e.moves);

  return rnd()<.75?ms[0]:pick(ms)}
async function battle(enemies,{trainer,special,easy}){
  await battleIntro({enemies,p:S.team.find(m=>m.hp>0)||S.team[0],trainer,special});B.rig=!!easy;
  let result=null;
  while(result===null){
    const act=await playerAction();
    if(act.run){
      if(trainer){await say("¡De un combate así no se huye, tío!");continue}
      if(rnd()<0.75){sfx("door");await say("Te piras disimulando. ¡Escapas sin problema!");result="run";break}
      await say("¡No puedes escapar! Te ha visto venir.");await enemyTurn();
    }else if(act.ball){const r=await throwBall(act.ball);if(r==="caught"){result="caught";break}if(r==="noturn")continue;await enemyTurn()}
    else if(act.item){await enemyTurn()}
    else if(act.sw!==undefined){await switchTo(act.sw);await enemyTurn()}
    else if(act.move){
      const em=eMovePick();
      const pFirst=eff(B.p,"spd")>=eff(B.e,"spd")*(0.9+rnd()*0.2);
      const order=pFirst?[[B.p,B.e,act.move,true],[B.e,B.p,em,false]]:[[B.e,B.p,em,false],[B.p,B.e,act.move,true]];
      for(const[u,t,mv,isP]of order){if(u.hp<=0||t.hp<=0)continue;await useMove(u,t,mv,isP,pFirst===isP)}
    }
    if(B.e.hp<=0){
      await faintAnim("e");await say(`¡${nameOf(B.e)} está KO!`);
      await giveXp(B.e);
      const next=B.enemies.find(m=>m.hp>0);
      if(next){B.e=next;S.seen[next.sp]=1;updHud();B.an.e={type:"in",start:now()};sfx("throw");await sleep(450);await say(`${trainer.short} saca a ${SP[next.sp].n}.`)}
      else result="win";
    }
    if(result===null&&B.p.hp<=0){
      await faintAnim("p");await say(`¡${SP[B.p.sp].n} está KO!`);
      if(S.team.some(m=>m.hp>0)){let i=-1;while(i<0)i=await teamMenu(true);await switchTo(i,true)}
      else result="lose";
    }
  }
  if(result==="win"&&trainer){S.money+=trainer.money;sfx("win");
    B.showE=false;B.trE.an={type:"in",start:now()};await sleep(500);
    await say(trainer.lose);await say(`Has ganado ${trainer.money} pavos.`)}
  if(result==="lose"){
    const lost=Math.floor(S.money/2);S.money-=lost;
    await say("Todo tu equipo está KO… Se te nubla la vista.");
    S.team.forEach(m=>m.hp=maxhp(m));S.map=S.respawn[0];S.x=S.respawn[1];S.y=S.respawn[2];S.dir="up";
  }
  await battleOutro();pushPresence();
  if(result==="lose")await say(`Te despiertas en el Kebab 24h con una resaca tremenda. Abdul: «Otra vez tú, amego… Ya te he curado el equipo.»`);
  for(const m of S.team){const s=SP[m.sp];if(s.evo&&m.lvl>=s.evo[0])await evolve(m)}
  S.team.forEach(m=>delete m.v);
  save();
  return result==="win";
}

      pop(tw,"-"+d+(crit?"!":""),m===2?"#ffd14a":m===.5?"#cfc4b4":"#ffffff");

      await say(b>=maxhp(u)?`${un} ya estaba como nuevo.`:`${un} recupera ${u.hp-b} PV.`);return}
    if(mv.eff==="atkup"){burst("electrico",ub.x,ub.y-24,18);sfx("lvl");if(u.v.atk)await say(`${un} ya va a tope de cafeína.`);else{u.v.atk=1;updHud();await say(`¡A ${un} le pega el subidón! Su ataque sube un montón.`)}return}
    burst(mv.t,tb.x,tb.y-24,14);sfx("status");await sleep(300);

  }

    const sw=(Math.sin(t/600)+1)/2;ctx.globalAlpha=.16;ctx.fillStyle=Math.floor(t/600)%2?"#f2a93b":"#f25a3a";ctx.beginPath();ctx.moveTo(SW*sw,0);ctx.lineTo(SW*sw-60,70);ctx.lineTo(SW*sw+60,70);ctx.fill();ctx.globalAlpha=1;
    const gg=ctx.createLinearGradient(0,66,0,SH);gg.addColorStop(0,"#6a4a2a");gg.addColorStop(1,"#4a2e1c");ctx.fillStyle=gg;ctx.fillRect(0,66,SW,SH-66);
    for(let i=0;i<16;i++)px(i*16,66,1,SH-66,"#3a2414");
  }else{
    const g=ctx.createLinearGradient(0,0,0,70);g.addColorStop(0,"#0c1030");g.addColorStop(1,"#3a2a5a");ctx.fillStyle=g;ctx.fillRect(0,0,SW,70);
    for(let i=0;i<26;i++){const h=hash(i,7);if(Math.sin(t/500+i*1.7)>-.6)px(h%SW,(h>>8)%50,1,1,i%5?"#ffffff":"#f2d14e")}
    ctx.fillStyle="#f4e7a8";ctx.beginPath();ctx.arc(210,16,7,0,7);ctx.fill();ctx.fillStyle="#0c1030";ctx.beginPath();ctx.arc(213,14,6,0,7);ctx.fill();
    let cx=0;SKY.forEach((b,i)=>{px(cx,66-b.h,b.w,b.h,"#1a1430");b.lit.forEach((l,j)=>{if(l&&j*4<b.h-4){const wx=cx+2+(j%3)*5,wy=66-b.h+3+Math.floor(j/3)*5;if(wx<cx+b.w-2)px(wx,wy,2,2,(Math.floor(t/2000)+i+j)%9?"#f2c14e":"#3a2a4a")}});cx+=b.w+1});
    const dirt=S.map==="descampado";const gg=ctx.createLinearGradient(0,66,0,SH);gg.addColorStop(0,dirt?"#8a7a5a":"#2f7a32");gg.addColorStop(1,dirt?"#5a4a2a":"#1f5a26");ctx.fillStyle=gg;ctx.fillRect(0,66,SW,SH-66);
    for(let i=0;i<30;i++){const h=hash(i,11);px(h%SW,70+(h>>8)%100,1,2,dirt?"#6a5a3a":"#3f9a3a")}
  }
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(EPOS.x,EPOS.y,42,8,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(PPOS.x,PPOS.y,48,9,0,0,7);ctx.fill();
  ctx.fillStyle=B.indoor?"rgba(242,169,59,.18)":"rgba(120,200,100,.25)";ctx.beginPath();ctx.ellipse(EPOS.x,EPOS.y-1,36,6,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(PPOS.x,PPOS.y-1,42,7,0,0,7);ctx.fill();
  let shx=0,shy=0;if(now()<B.shakeUntil){shx=ri(-3,3);shy=ri(-2,2)}
  ctx.save();ctx.translate(shx,shy);
  if(B.trE&&!B.showE)drawTrainer(B.trE,"e",t);
  if(B.e&&B.showE&&!B.hideE)drawMon(B.e,"e",t);
  if(!B.showP)drawTrainer(B.trP,"p",t);
  if(B.p&&B.showP)drawMon(B.p,"p",t);
  if(B.cap){
    if(B.cap.phase==="throw"){const q=Math.min(1,(t-B.cap.start)/450);const x=PPOS.x+(EPOS.x-PPOS.x)*q,y=PPOS.y-30+(EPOS.y-30-(PPOS.y-30))*q-Math.sin(q*Math.PI)*40;drawBallIcon(B.cap.fam,x,y,q*12)}
    else{let rot=0;if(B.cap.wob){const q=(t-B.cap.wob)/320;if(q<1)rot=Math.sin(q*Math.PI*3)*.5}drawBallIcon(B.cap.fam,EPOS.x,EPOS.y-6,rot)}
  }
  drawParts();
  ctx.restore();
  for(let i=B.pops.length-1;i>=0;i--){const p=B.pops[i],q=(t-p.start)/800;if(q>=1){B.pops.splice(i,1);continue}
    ctx.font="bold 10px monospace";ctx.textAlign="center";ctx.globalAlpha=1-Math.max(0,q-.6)/.4;ctx.fillStyle="#000";ctx.fillText(p.text,p.x+1,p.y-q*16+1);ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y-q*16);ctx.globalAlpha=1}
}
function renderTitle(t){ctx.fillStyle="#0d0a08";ctx.fillRect(0,0,SW,SH);for(let i=0;i<40;i++){const h=hash(i,3);px(h%SW,(h>>8)%SH,1,1,(t/300+i)%9<1?"#f2a93b":"#3a2a1c")}}
function frame(t){
  bumpCd--;update();if(AC)setMusic(wantedMusic());
  try{if(mode==="battle"&&B)renderBattle(t);else if(mode==="world"&&S)renderWorld(t);else renderTitle(t);drawFX(t)}catch(e){console.error(e)}
  requestAnimationFrame(frame);
}

/* ===================== PANTALLA ===================== */
function fit(){
  const app=$("app"),pad=$("pad"),keys=$("keys");
  const padH=getComputedStyle(pad).display==="none"?0:pad.offsetHeight+10;
  const keysH=getComputedStyle(keys).display==="none"?0:keys.offsetHeight+10;
  const cs=getComputedStyle(app);
  const availW=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-6;
  const availH=app.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-padH-keysH-6;
  let w=Math.min(availW,availH*SW/SH,960);w=Math.max(200,w);
  const scr=$("screen");scr.style.width=w+"px";scr.style.height=(w*SH/SW)+"px";
  document.documentElement.style.setProperty("--fs",Math.max(11,Math.min(22,w/24))+"px");
  document.documentElement.style.setProperty("--sh",(w*SH/SW)+"px");
}
addEventListener("resize",fit);

    <div class="btns">${has?`<button class="big" type="button" id="t-cont">Continuar</button>`:""}<button class="big ${has?"alt":""}" type="button" id="t-new">Nueva partida</button></div>
    <p class="keys">Móvil: cruceta, A, B y el botón CORRER. Ordenador: flechas, Enter para hablar, X para volver y Espacio para correr. Con sonido: se quita desde el Menú.<br>Multijugador: abrid el juego a la vez y quedad en El Descampado.</p>

  if(has)$("t-cont").onclick=async()=>{S=Object.assign(freshState(),has);S.bag=Object.assign({},has.bag||{});S.flags=Object.assign(freshState().flags,has.flags||{});S.q=Object.assign({gorra:0,placa:0,walkie:0,michi:0,basura:0,cuerda:0},has.q||{});S.accU=has.accU||{};
    S.keys=has.keys||{};S.beaten=has.beaten||{};S.skin=cleanSkin(has.skin);if(!MAPS[S.map])S.map="park";if(!Array.isArray(S.respawn)||S.respawn.length<3||!MAPS[S.respawn[0]])S.respawn=["kebab",4,3];
    closeOverlay();if(!S.name)await nameScreen();start()};

function start(){
  closeOverlay();sfx("door");mode="world";ensureBoxes();
  const ch=NPCS.find(n=>n.id==="chusta");if(S.flags.chusta){ch.x=17;ch.y=11}
  if(S.flags.poli)NPCS.filter(n=>n.id==="poli"||n.id==="poli2").forEach(n=>n.x=-10);
  FX.fade={from:1,to:0,start:now(),dur:500};pushPresence();updOnline();
  if(!S.flags.starter)run(async()=>{S.dir="left";await sleep(500);await intro()});
}
function boot(data){fit();if(data&&data.state){S=data.state;start()}else titleScreen();requestAnimationFrame(frame);initRoom()}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({state:mode==="title"?null:S}))}catch(e){}}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot(window.claude&&window.claude.hot&&window.claude.hot.data||{});
